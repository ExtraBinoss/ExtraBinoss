name: Refresh profile stars

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-stars
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Refresh plain-text star counts
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = context.payload.repository.default_branch;
            const marker = /<!-- stars:([A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+) -->[\s\S]*?<!-- \/stars -->/g;
            const format = new Intl.NumberFormat("en-US");

            for (let attempt = 0; attempt < 3; attempt++) {
              const { data: file } = await github.rest.repos.getContent({
                owner, repo, path: "README.md", ref: branch,
              });
              if (file.type !== "file" || file.encoding !== "base64") {
                throw new Error("Expected a base64-encoded README.md file.");
              }
              const source = Buffer.from(file.content, "base64").toString("utf8");
              const repositories = [...new Set([...source.matchAll(marker)].map(match => match[1]))];
              if (!repositories.length) throw new Error("No star markers found in README.md.");

              // A failed request leaves the existing README untouched.
              const counts = new Map(await Promise.all(repositories.map(async repository => {
                const [owner, repo] = repository.split("/");
                const { data } = await github.rest.repos.get({ owner, repo });
                if (data.private || !Number.isSafeInteger(data.stargazers_count) || data.stargazers_count < 0) {
                  throw new Error(`Invalid public star count for ${repository}.`);
                }
                return [repository, data.stargazers_count];
              })));

              const updated = source.replace(marker, (_, repository) => {
                const count = counts.get(repository);
                const text = count > 0 ? `&nbsp;⭐&nbsp;${format.format(count)}` : "";
                return `<!-- stars:${repository} -->${text}<!-- /stars -->`;
              });
              if (updated === source) {
                core.info("Star counts are already up to date; no commit needed.");
                return;
              }

              try {
                await github.rest.repos.createOrUpdateFileContents({
                  owner, repo, branch, path: "README.md", sha: file.sha,
                  message: "docs: refresh profile star counts [skip ci]",
                  content: Buffer.from(updated, "utf8").toString("base64"),
                });
                core.info(`Refreshed star counts for ${repositories.length} public repositories.`);
                return;
              } catch (error) {
                if (error.status !== 409 || attempt === 2) throw error;
                core.info("README changed during refresh; retrying with the latest version.");
              }
            }
